spring:
  application:
    name: control-plane

  datasource:
    url: jdbc:postgresql://postgres:5432/deccan
    username: deccan
    password: deccan
    
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jpa:
    open-in-view: false

    properties:
      hibernate:
        format_sql: true
  

server:
  port: 8088
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger
  
security:
  jwt:
    secret: VopUFd82sAltjS6QLENm0o7cAsDRrHfeMIx4OKpSGkI1L2XAPAlFh/1A08/lUoMCWoj/nIPCzTuehxatOTu0xA==
    expiration: 86400000

deccan:
  bootstrap:
    enabled: true
    organization:
      name: Deccan
      slug: deccan

    admin:
      first-name: Admin
      last-name: User
      email: admin@deccan.dev
      password: change-me