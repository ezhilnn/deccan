services:

  postgres:
    image: postgres:17
    container_name: deccan-postgres
    restart: unless-stopped
    env_file:
      - ../../.env
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: deccan-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  kafka:
    image: apache/kafka:4.1.0
    container_name: deccan-kafka
    restart: unless-stopped

    environment:
      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      CLUSTER_ID: deccan-cluster

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1

    ports:
      - "9092:9092"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: deccan-kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: deccan
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  minio:
    image: minio/minio:latest
    container_name: deccan-minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    env_file:
      - ../../.env
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: deccan-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  prometheus:
    image: prom/prometheus:latest
    container_name: deccan-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ../docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    container_name: deccan-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"

  otel-collector:
    image: otel/opentelemetry-collector:latest
    container_name: deccan-otel
    restart: unless-stopped
    command:
      - "--config=/etc/otelcol/config.yaml"
    volumes:
      - ../docker/otel-collector/otel-collector-config.yaml:/etc/otelcol/config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
  control-plane:
    build:
      context: ../../apps/control-plane
    container_name: deccan-control-plane
    depends_on:
      - postgres
      - kafka
    ports:
      - "8088:8088"
  worker:
    build:
      context: ../../apps/worker
    container_name: deccan-worker
    restart: unless-stopped
    depends_on:
      - control-plane
      - kafka
    environment:
      SERVER_PORT: 8187
      CONTROL_PLANE_URL: http://control-plane:8088/api
      WORKER_NAME: worker-01
    ports:
      - "8187:8187"

volumes:
  postgres-data:
  minio-data:
  qdrant-data: